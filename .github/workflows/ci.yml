name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from the example with CI-only secrets
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci$(openssl rand -hex 8)/" .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" .env
      - name: Lint
        run: docker compose run --rm --no-deps api sh -c "pip install -q --user ruff==0.17.1 && ~/.local/bin/ruff check ."
      - name: Run pytest
        run: docker compose run --rm api pytest -q
      - name: Stop services
        if: always()
        run: docker compose down -v
